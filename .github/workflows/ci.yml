name: FieldOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ci_test_db?schema=public"
        run: npx prisma generate

      - name: Build NestJS backend
        working-directory: backend
        env:
          NODE_ENV: production
          JWT_SECRET: "ci_jwt_secret_placeholder_for_compilation"
          FRONTEND_URL: "http://localhost:3000"
        run: npm run build

      - name: Run backend tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:4000"
        run: npm run build
